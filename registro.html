<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | AJJITEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>.auth-page{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:60px 0}.auth-card{width:min(100%,560px);background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:10px;padding:38px}.auth-card h1{font-size:38px;letter-spacing:-.07em;line-height:1;margin:0 0 12px}.auth-card>p:not(.eyebrow){color:var(--muted);font-size:14px;margin:0 0 30px}.auth-form{display:grid;grid-template-columns:1fr 1fr;gap:18px}.auth-form label{display:grid;gap:8px;color:var(--muted);font:11px var(--mono);letter-spacing:.05em}.auth-form label.full,.auth-form button{grid-column:1/-1}.auth-form input{width:100%;border:1px solid var(--line);border-radius:6px;background:#080c14;color:var(--text);font:14px var(--sans);padding:14px;outline:none}.auth-form input:focus{border-color:var(--blue)}.auth-form button{border:0;cursor:pointer;justify-content:center}.auth-help{margin-top:22px;font-size:12px}.auth-help a{color:var(--muted);text-decoration:none}.auth-status{color:var(--blue);font:11px var(--mono);min-height:16px}@media(max-width:560px){.auth-form{grid-template-columns:1fr}.auth-form label,.auth-form button{grid-column:1}}</style>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html"><img src="assets/ajjitec-logo.png" alt="AJJITEC Mexicana" /></a><a class="text-link" href="login.html">Ya tengo cuenta ↗</a></header>
    <main class="auth-page shell"><section class="auth-card"><p class="eyebrow">REGISTRO / 01</p><h1>Crea tu acceso.</h1><p>Registra tus datos para solicitar acceso al área de clientes.</p><form class="auth-form" id="register-form"><label>Nombre<input name="name" required /></label><label>Empresa<input name="company" required /></label><label class="full">Correo electrónico<input type="email" name="email" required /></label><label class="full">Teléfono<input type="tel" name="phone" /></label><label>Contraseña<input type="password" name="password" minlength="8" required /></label><label>Confirmar contraseña<input type="password" name="password_confirmation" minlength="8" required /></label><button class="button button-primary" type="submit">Solicitar registro <span>↗</span></button></form><p class="auth-status" id="auth-status" aria-live="polite"></p><div class="auth-help"><a href="index.html">← Volver al sitio público</a></div></section></main>
    <script>document.querySelector('#register-form').addEventListener('submit',(event)=>{event.preventDefault();document.querySelector('#auth-status').textContent='Solicitud preparada. La conexión con el sistema de cuentas está pendiente.'});</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="auth.js"></script>
  </body>
</html>
