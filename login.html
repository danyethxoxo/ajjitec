<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | AJJITEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-page{min-height:calc(100vh - 114px);display:grid;place-items:center;padding:60px 0}.auth-card{width:min(100%,440px);background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:10px;padding:38px;box-shadow:0 25px 80px rgba(0,0,0,.28)}.auth-card h1{font-size:38px;letter-spacing:-.07em;line-height:1;margin:0 0 12px}.auth-card>p:not(.eyebrow){color:var(--muted);font-size:14px;margin:0 0 30px}.auth-form{display:grid;gap:18px}.auth-form label{display:grid;gap:8px;color:var(--muted);font:11px var(--mono);letter-spacing:.05em}.auth-form input{width:100%;border:1px solid var(--line);border-radius:6px;background:#080c14;color:var(--text);font:14px var(--sans);padding:14px;outline:none}.auth-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(115,169,255,.12)}.auth-form button{border:0;cursor:pointer;justify-content:center;font-family:var(--sans);margin-top:6px}.auth-help{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:12px}.auth-help a{color:var(--muted);text-decoration:none}.auth-help a:hover{color:var(--text)}.auth-status{color:var(--blue);font:11px var(--mono);min-height:16px;margin:16px 0 0}
    </style>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html"><img src="assets/ajjitec-logo.png" alt="AJJITEC Mexicana" /></a><a class="text-link" href="index.html">← Volver al sitio</a></header>
    <main class="auth-page shell"><section class="auth-card"><p class="eyebrow">ÁREA ADMINISTRATIVA / 01</p><h1>Bienvenido de nuevo.</h1><p>Accede para gestionar inventario, clientes y cotizaciones.</p><form class="auth-form" id="login-form"><label>Correo electrónico<input type="email" name="email" placeholder="nombre@ajjitec.com" required /></label><label>Contraseña<input type="password" name="password" placeholder="••••••••" required /></label><button class="button button-primary" type="submit">Iniciar sesión <span>↗</span></button></form><p class="auth-status" id="auth-status" aria-live="polite"></p><div class="auth-help"><a href="mailto:ventas@ajjitec.com?subject=Recuperar%20acceso">¿Olvidaste tu contraseña?</a><a href="registro.html">Crear cuenta ↗</a></div></section></main>
    <script>document.querySelector('#login-form').addEventListener('submit',(event)=>{event.preventDefault();document.querySelector('#auth-status').textContent='La autenticación se conectará en la siguiente etapa.'});</script>
  </body>
</html>
