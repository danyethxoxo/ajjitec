<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activar acceso | AJJITEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=portal-routes-1" />
    <link rel="stylesheet" href="light-theme.css?v=portal-routes-6" />
    <style>
      .auth-page{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:60px 0}.auth-card{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:10px;padding:38px;box-shadow:0 25px 80px rgba(31,83,145,.12)}.auth-card h1{font-size:38px;letter-spacing:-.07em;line-height:1;margin:0 0 12px}.auth-card>p:not(.eyebrow){color:var(--muted);font-size:14px;margin:0 0 30px}.auth-form{display:grid;gap:18px}.auth-form label{display:grid;gap:8px;color:var(--muted);font:11px var(--mono);letter-spacing:.05em}.auth-form input{width:100%;border:1px solid #c7d7e9;border-radius:6px;background:#fff;color:var(--text);font:14px var(--sans);padding:14px;outline:none}.auth-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,99,215,.12)}.auth-form button{border:0;cursor:pointer;justify-content:center;font-family:var(--sans);margin-top:6px}.auth-status{color:var(--blue-dark);font:11px var(--mono);min-height:16px;margin:16px 0 0}.auth-status[data-state="error"]{color:#b42318}.auth-help{margin-top:22px;font-size:12px}.auth-help a{color:var(--muted);text-decoration:none}.auth-help a:hover{color:var(--text)}
    </style>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html"><img src="assets/ajjitec-logo.png" alt="AJJITEC Mexicana" /></a><a class="text-link" href="login.html">Iniciar sesión ↗</a></header>
    <main class="auth-page shell"><section class="auth-card"><p class="eyebrow">ACCESO / ACTIVACIÓN</p><h1>Define tu contraseña.</h1><p>Completa la activación de tu cuenta AJJITEC.</p><form class="auth-form" id="invite-password-form"><label>Nueva contraseña<input type="password" name="password" minlength="8" autocomplete="new-password" required /></label><label>Confirmar contraseña<input type="password" name="password_confirmation" minlength="8" autocomplete="new-password" required /></label><button class="button button-primary" type="submit">Activar acceso <span>↗</span></button></form><p class="auth-status" id="auth-status" aria-live="polite"></p><div class="auth-help"><a href="login.html">Volver al inicio de sesión ↗</a></div></section></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=portal-routes-2"></script><script src="auth.js?v=portal-routes-2"></script>
  </body>
</html>
