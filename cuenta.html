<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirigiendo al portal | AJJITEC</title>
    <link rel="stylesheet" href="light-theme.css?v=portal-routes-1" />
  </head>
  <body>
    <main class="shell" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px">
      <p>Abriendo el resumen del portal… <a href="resumen.html">Continuar</a></p>
    </main>
    <noscript><meta http-equiv="refresh" content="0; url=resumen.html" /></noscript>
    <script>
      const destination = new URLSearchParams(window.location.search).get('reset') === '1'
        ? 'perfil.html'
        : 'resumen.html';
      window.location.replace(destination + window.location.search + window.location.hash);
    </script>
  </body>
</html>
