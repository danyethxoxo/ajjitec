<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirigiendo al portal | AJJITEC</title>
    <link rel="stylesheet" href="light-theme.css?v=portal-routes-4" />
  </head>
  <body>
    <main class="shell" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px">
      <p>Abriendo el resumen del portal… <a href="resumen.html">Continuar</a></p>
    </main>
    <noscript><meta http-equiv="refresh" content="0; url=resumen.html" /></noscript>
    <script>
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const hasAuthToken = hashParams.has('access_token');
      const isInvite = params.get('invite') === '1' || hashParams.get('type') === 'invite';
      const isRecovery = params.get('reset') === '1' && hasAuthToken;
      const destination = isInvite || isRecovery
        ? 'activar.html'
        : params.get('reset') === '1'
          ? 'perfil.html'
          : 'resumen.html';
      const nextQuery = isInvite ? '?invite=1' : isRecovery ? '?reset=1' : window.location.search;
      window.location.replace(destination + nextQuery + window.location.hash);
    </script>
  </body>
</html>
