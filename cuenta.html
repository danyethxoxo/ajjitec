<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta | AJJITEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html"><img src="assets/ajjitec-logo.png" alt="AJJITEC Mexicana" /></a><a class="text-link" href="index.html">Volver al sitio ↗</a></header>
    <main class="auth-page shell" data-account-page>
      <section class="auth-card account-card"><p class="eyebrow">ÁREA DE CLIENTES / 01</p><h1>Mi cuenta.</h1><p>Tu acceso AJJITEC está activo.</p><div class="account-details"><div><span>USUARIO</span><strong data-user-name>Cargando…</strong></div><div><span>CORREO</span><strong data-user-email>Cargando…</strong></div><div><span>EMPRESA</span><strong data-user-company>Cargando…</strong></div><div><span>TELÉFONO</span><strong data-user-phone>Cargando…</strong></div></div><div class="account-actions"><button class="button button-ghost" id="logout-button" type="button">Cerrar sesión</button><button class="button button-primary" type="button" onclick="document.querySelector('[data-password-panel]').removeAttribute('hidden')">Cambiar contraseña <span>↗</span></button></div><div data-password-panel hidden><form class="auth-form" id="password-form"><label>Nueva contraseña<input type="password" name="password" minlength="6" required /></label><label>Confirmar contraseña<input type="password" name="password_confirmation" minlength="6" required /></label><button class="button button-primary" type="submit">Actualizar contraseña <span>↗</span></button></form></div><p class="auth-status" id="auth-status" aria-live="polite"></p></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="auth.js"></script>
  </body>
</html>
